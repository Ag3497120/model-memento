name: CI Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Chrome for headless CDP checks
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 全モジュールをオフラインで検査
        run: npm test

      - name: 軽量アプリの配布サイズを検査
        run: npm run check:package-size

      - name: Validate contributed harness schemas
        run: npm run check:contrib

      - name: Build static web catalog
        run: npm run build:web -- --offline

      - name: Verify structural contracts, Vera reasoning, and headless Chrome geometry
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:web
