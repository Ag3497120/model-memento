# Model Memento relay. Deploy: see README.md in this folder.
name = "model-memento-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The facts the relay may use, bundled with the Worker (built by scripts/build-relay-facts.js).
[assets]
directory = "../web/data/facts"
binding = "ASSETS"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

# The free plan needs SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Budget"]

[vars]
# The published site (ends with /). The relay reads data/facts/<xx>.json from here.
SITE_URL = "https://ag3497120.github.io/model-memento/"
# Sites allowed to call the relay (comma separated, exact origins).
ALLOWED_ORIGINS = "https://ag3497120.github.io,http://localhost:5190,http://localhost:5191"
# "workers-ai" (default, no card needed) or "gemini" (set the GEMINI_API_KEY secret first).
PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"   # 2026-11-16: llama-3.1-8b was retired 2026-05-30; Qwen3 answered best in Japanese
GEMINI_MODEL = "gemini-2.5-flash"
DAILY_LIMIT = "300"
PER_IP_LIMIT = "20"
